name: Python Code Quality & Tests

on:
  push:
  pull_request:
    branches: [main, master]

# No Nexus credentials or write permissions are required for local tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 -r requirements.txt

      - name: Check syntax and undefined names
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m compileall -q main.py blobs.py config_validation.py config_secrets.py nexus_cleaner.py modules tests

      - name: Run local unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate sample configuration (offline only)
        run: python main.py --dry-run
